version: "3.9"

services:
  jiradc_todoist_sync:
    build: .
    image: jiradc-todoist-sync:latest
    container_name: jiradc-todoist-sync
    restart: unless-stopped
    environment:
      # Required
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - TODOIST_API_TOKEN=${TODOIST_API_TOKEN}
      - JIRA_SERVER_URL=${JIRA_SERVER_URL}
      # Optional
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-5}
      - DEBUG=${DEBUG:-false}
    # If you prefer to persist .env/config generated by the app, mount a volume
    volumes:
      - ./:/app
    # Healthcheck inherited from Dockerfile; can optionally add here
    # healthcheck:
    #   test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q 'python -u /app/main.py'"]
    #   interval: 1m
    #   timeout: 10s
    #   retries: 3

# Usage:
# 1) cp .env.example .env  # edit values
# 2) docker compose up -d
# 3) docker compose logs -f
